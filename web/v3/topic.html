<style>
  #topco-tbody tr.co-row { cursor: pointer; transition: background-color .12s ease; }
  #topco-tbody tr.co-row:hover { background-color: rgba(184,89,87,0.06); }

  /* ============ Concentration block ============ */
  .conc-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1.4fr;
    gap: 14px;
    margin-bottom: 18px;
  }
  .conc-card {
    background: var(--surface-3);
    border: 1px solid var(--hairline-2);
    border-radius: 6px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .conc-card .k {
    font-family: var(--f-mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .conc-card .v {
    display: block;
    font-family: var(--f-serif-it);
    font-style: italic;
    font-size: 42px;
    line-height: 1;
    margin: 8px 0 4px;
    color: var(--accent-2);
    font-weight: 500;
  }
  .conc-card .label {
    font-family: var(--f-body);
    font-size: 12.5px;
    color: var(--ink-2);
    font-style: italic;
  }
  .conc-card .class-chip {
    display: inline-block;
    margin-top: 6px;
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 99px;
    border: 1px solid currentColor;
  }
  .conc-card .class-chip.fragmented { color: #5a7a4a; background: rgba(168,181,154,0.18); }
  .conc-card .class-chip.moderate   { color: #b87a3a; background: rgba(236,155,115,0.18); }
  .conc-card .class-chip.concentrated { color: var(--accent-2); background: rgba(184,89,87,0.18); }
  .conc-top10 {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .conc-top10 .row {
    display: grid;
    grid-template-columns: 22px 1fr 1fr 56px;
    gap: 8px;
    align-items: center;
    font-family: var(--f-body);
    font-size: 12px;
    color: var(--ink);
    padding: 4px 0;
    cursor: pointer;
    border-bottom: 1px dashed var(--hairline-2);
  }
  .conc-top10 .row:last-child { border-bottom: none; }
  .conc-top10 .row:hover { background: rgba(184,89,87,0.05); }
  .conc-top10 .row .rk { font-family: var(--f-mono); font-size: 10px; color: var(--muted); }
  .conc-top10 .row .nm { font-weight: 500; }
  .conc-top10 .row .bar {
    height: 7px; background: var(--surface); border-radius: 99px; overflow: hidden;
  }
  .conc-top10 .row .bar .fill { height: 100%; background: var(--bar-color, var(--accent)); border-radius: 99px; }
  .conc-top10 .row .pct {
    font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-2); text-align: right;
  }

  /* ============ Value chain ============ */
  .vc-bars {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .vc-bar {
    display: grid;
    grid-template-columns: 140px 1fr 60px;
    gap: 12px;
    align-items: center;
    font-family: var(--f-body);
    font-size: 13px;
    color: var(--ink);
  }
  .vc-bar .role { font-weight: 500; }
  .vc-bar .track {
    height: 18px;
    background: var(--surface);
    border-radius: 99px;
    overflow: hidden;
    border: 1px solid var(--hairline-2);
  }
  .vc-bar .track .fill {
    height: 100%;
    background: var(--vc-color, var(--accent));
    border-radius: 99px;
    transition: width .3s ease;
  }
  .vc-bar .n {
    font-family: var(--f-mono);
    font-size: 12px;
    color: var(--ink-2);
    text-align: right;
  }

  /* ============ Focused L2 analysis ============ */
  .subtrack-analysis {
    border-top: 3px solid var(--topic-color, var(--accent));
  }
  .subtrack-kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin: 16px 0 14px;
  }
  .subtrack-kpi {
    background: var(--surface-3);
    border: 1px solid var(--hairline-2);
    border-radius: 6px;
    padding: 14px 16px;
  }
  .subtrack-kpi .k {
    display: block;
    font-family: var(--f-body);
    font-size: 12px;
    color: var(--muted);
  }
  .subtrack-kpi .v {
    display: block;
    font-family: var(--f-serif-it);
    font-style: italic;
    font-size: 38px;
    line-height: 1;
    margin-top: 8px;
    color: var(--topic-color, var(--accent-2));
  }
  .subtrack-kpi .d {
    display: block;
    margin-top: 6px;
    font-family: var(--f-mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .subtrack-analysis-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }
  .subtrack-chart {
    background: var(--surface-3);
    border: 1px solid var(--hairline-2);
    border-radius: 6px;
    padding: 16px 18px;
  }
  .subtrack-chart.wide {
    grid-column: 1 / -1;
  }
  .subtrack-chart h3 {
    margin: 0 0 10px;
    font-family: var(--f-body);
    font-size: 15px;
    color: var(--ink);
  }
  .subtrack-bar-list {
    display: grid;
    gap: 8px;
  }
  .subtrack-bar-row {
    display: grid;
    grid-template-columns: minmax(110px, 170px) 1fr 74px;
    gap: 10px;
    align-items: center;
    min-height: 24px;
    font-family: var(--f-body);
    font-size: 12.5px;
    color: var(--ink);
  }
  .subtrack-bar-row .name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .subtrack-bar-row .track {
    height: 14px;
    background: var(--surface);
    border: 1px solid var(--hairline-2);
    border-radius: 99px;
    overflow: hidden;
  }
  .subtrack-bar-row .fill {
    display: block;
    height: 100%;
    width: var(--pct, 0%);
    background: var(--topic-color, var(--accent));
    border-radius: 99px;
  }
  .subtrack-bar-row .n {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--ink-2);
    text-align: right;
  }
  .subtrack-empty {
    padding: 16px 0;
    color: var(--muted);
    font-style: italic;
    font-size: 13px;
  }

  /* ============ Lifecycle scatter ============ */
  .lc-scatter {
    position: relative;
    background:
      linear-gradient(180deg, transparent 49.5%, var(--hairline-2) 49.5%, var(--hairline-2) 50.5%, transparent 50.5%),
      linear-gradient(90deg, transparent 49.5%, var(--hairline-2) 49.5%, var(--hairline-2) 50.5%, transparent 50.5%);
    background-size: 25% 25%;
    background-color: var(--surface-3);
    border: 1px solid var(--hairline-2);
    border-radius: 6px;
    width: 100%;
    height: 380px;
    margin-top: 12px;
  }
  .lc-axis {
    position: absolute;
    font-family: var(--f-mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .lc-axis.x-label { bottom: 6px; right: 14px; }
  .lc-axis.y-label { top: 14px; left: 14px; writing-mode: vertical-rl; transform: rotate(180deg); }
  .lc-quadrant-label {
    position: absolute;
    font-family: var(--f-serif-it);
    font-style: italic;
    font-size: 11px;
    color: var(--muted);
    opacity: 0.7;
    padding: 2px 6px;
    border: 1px dashed var(--hairline);
    border-radius: 99px;
    background: var(--surface-2);
  }
  .lc-dot {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    transform: translate(-50%, 50%);
    transition: transform .15s ease, box-shadow .15s ease;
    background: var(--dot-color, var(--accent));
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(58,51,64,0.18);
  }
  .lc-dot:hover {
    transform: translate(-50%, 50%) scale(1.15);
    box-shadow: 0 6px 14px rgba(58,51,64,0.28);
    z-index: 10;
  }
  .lc-dot-label {
    position: absolute;
    font-family: var(--f-body);
    font-size: 11px;
    color: var(--ink-2);
    background: var(--surface-3);
    padding: 1px 6px;
    border-radius: 3px;
    border: 1px solid var(--hairline-2);
    white-space: nowrap;
    pointer-events: none;
    transform: translate(-50%, -120%);
  }

  /* ============ Indication × regulator heatmap ============ */
  .ir-mini-row {
    display: grid;
    grid-template-columns: 200px repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 6px;
    align-items: center;
  }
  .ir-mini-row.head {
    font-family: var(--f-mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .ir-mini-row .bk-label {
    font-family: var(--f-body);
    font-size: 13px;
    color: var(--ink);
    padding-right: 8px;
  }
  .ir-mini-row .bk-label small {
    display: block;
    font-family: var(--f-mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-top: 1px;
  }
  .ir-mini-cell {
    background: var(--surface-3);
    border: 1px solid var(--hairline-2);
    border-radius: 4px;
    padding: 8px 6px;
    text-align: center;
    cursor: pointer;
    transition: all .12s ease;
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--ink-2);
  }
  .ir-mini-cell.has { background: linear-gradient(135deg, rgba(184,89,87, calc(var(--cv,0)*0.55)) 0%, rgba(107,90,117, calc(var(--cv,0)*0.35)) 100%); }
  .ir-mini-cell.has:hover { transform: scale(1.04); box-shadow: 0 3px 10px rgba(58,51,64,0.15); }
  .ir-mini-cell.zero { opacity: 0.4; cursor: default; }
  .ir-mini-cell .v { font-family: var(--f-serif-it); font-style: italic; font-size: 17px; color: var(--ink); display: block; font-weight: 500; }

  /* ============ Recent entrants ============ */
  .entrants-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .entrants-col {
    background: var(--surface-3);
    border: 1px solid var(--hairline-2);
    border-radius: 6px;
    padding: 16px 18px;
  }
  .entrants-col h4 {
    font-family: var(--f-display);
    font-size: 16px;
    font-weight: 400;
    color: var(--ink);
    margin: 0 0 4px;
  }
  .entrants-col .head-sub {
    font-family: var(--f-body);
    font-style: italic;
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .entrants-col .e-row {
    display: grid;
    grid-template-columns: 50px 1fr 90px 38px;
    gap: 8px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px dashed var(--hairline-2);
    cursor: pointer;
  }
  .entrants-col .e-row:last-child { border-bottom: none; }
  .entrants-col .e-row:hover { background: rgba(184,89,87,0.05); }
  .entrants-col .e-row .date {
    font-family: var(--f-mono);
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .entrants-col .e-row .nm {
    font-family: var(--f-body);
    font-size: 13px;
    color: var(--ink);
    font-weight: 500;
  }
  .entrants-col .e-row .nm small {
    display: block;
    font-family: var(--f-mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .entrants-col .e-row .own {
    font-family: var(--f-mono);
    font-size: 10px;
    text-align: center;
    color: var(--ink-2);
    padding: 2px 4px;
    border: 1px solid var(--hairline);
    border-radius: 3px;
  }
  .entrants-col .e-row .badge {
    font-family: var(--f-serif-it);
    font-style: italic;
    font-size: 16px;
    color: var(--accent-2);
    text-align: right;
    font-weight: 500;
  }
  .entrants-col .e-empty {
    padding: 28px 0;
    text-align: center;
    color: var(--muted);
    font-style: italic;
    font-family: var(--f-body);
    font-size: 12px;
  }

  /* ============ Mega track second-level entry ============ */
  .topic-mega-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }
  .topic-mega-card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    min-width: 0;
    padding: 14px 16px;
    border: 1px solid var(--hairline-2);
    border-left: 4px solid var(--topic-color, var(--accent));
    border-radius: 8px;
    background: rgba(255,252,245,0.72);
    color: inherit;
    text-decoration: none;
    transition: transform .14s ease, border-color .14s ease, background .14s ease;
  }
  .topic-mega-card:hover {
    transform: translateY(-1px);
    border-color: rgba(80,60,70,0.22);
    background: rgba(255,252,245,0.92);
  }
  .topic-mega-card strong {
    display: block;
    color: var(--ink);
    font-family: var(--f-display-cn);
    font-weight: 400;
    font-size: 15px;
    line-height: 1.25;
  }
  .topic-mega-card span {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-family: var(--f-sans);
    font-size: 11.5px;
    line-height: 1.35;
  }
  .topic-mega-card em {
    color: var(--topic-color, var(--accent));
    font-family: var(--f-serif-it);
    font-style: italic;
    font-size: 24px;
    line-height: 1;
    white-space: nowrap;
  }

  /* ============ Country × L2 cross-matrix ============ */
  .cl-matrix {
    display: grid;
    border: 1px solid var(--hairline-2);
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface-3);
  }
  .cl-cell, .cl-head {
    padding: 8px 6px;
    border-right: 1px solid var(--hairline-2);
    border-bottom: 1px solid var(--hairline-2);
    font-family: var(--f-mono);
    font-size: 10.5px;
    text-align: center;
    min-height: 44px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .cl-cell:last-child, .cl-head:last-child { border-right: none; }
  .cl-head { background: var(--surface); color: var(--ink); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
  .cl-row-label {
    background: var(--surface-2);
    border-right: 2px solid var(--rose-dust);
    align-items: flex-start;
    padding-left: 12px;
    text-align: left;
    font-family: var(--f-body);
    font-size: 12.5px;
    color: var(--ink);
  }
  .cl-cell.has-data {
    cursor: pointer;
    background: linear-gradient(135deg, rgba(184,89,87, calc(var(--cv,0)*0.45)) 0%, rgba(107,90,117, calc(var(--cv,0)*0.30)) 100%);
    transition: transform .12s ease;
  }
  .cl-cell.has-data:hover { transform: scale(1.06); z-index: 5; }
  .cl-cell.zero { color: var(--subtle); opacity: 0.45; }
  .cl-cell .n { font-family: var(--f-serif-it); font-style: italic; font-size: 17px; color: var(--ink); font-weight: 500; }

  /* ============ Drill-down panel (reuses xa-drill from cross-analysis aesthetic) ============ */
  .td-drill {
    position: fixed; top: 0; right: 0; height: 100vh;
    width: min(440px, 92vw);
    background: var(--surface-2);
    color: var(--ink);
    border-left: 1px solid var(--hairline);
    box-shadow: -10px 0 36px rgba(58,51,64,0.18);
    transform: translateX(100%);
    transition: transform .26s cubic-bezier(.4,0,.2,1);
    z-index: 9100;
    display: flex; flex-direction: column;
    font-family: var(--f-body);
  }
  .td-drill.show { transform: translateX(0); }
  .td-drill .head {
    padding: 22px 26px 14px;
    border-bottom: 1px solid var(--hairline-2);
    position: relative;
  }
  .td-drill .head .stamp {
    font-family: var(--f-mono); font-size: 10.5px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
    padding: 3px 10px;
    border: 1px solid var(--hairline);
    border-radius: 99px;
    display: inline-block;
  }
  .td-drill .head h3 {
    font-family: var(--f-display);
    font-size: 22px; line-height: 1.2;
    margin: 10px 0 4px; font-weight: 400;
    color: var(--ink);
  }
  .td-drill .head .sub {
    font-style: italic; font-size: 12.5px; color: var(--muted);
  }
  .td-drill .close-btn {
    position: absolute; top: 18px; right: 20px;
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--hairline); background: transparent;
    color: var(--ink); font-size: 16px; cursor: pointer;
  }
  .td-drill .close-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .td-drill .body { flex: 1; overflow-y: auto; padding: 14px 22px 26px; }
  .td-drill .body .row {
    display: flex; gap: 10px; align-items: center;
    padding: 8px 4px;
    border-bottom: 1px dashed var(--hairline-2);
    cursor: pointer;
  }
  .td-drill .body .row:hover { background: rgba(184,89,87,0.04); }
  .td-drill .body .row .sw {
    width: 6px; height: 26px; border-radius: 2px; flex-shrink: 0;
    background: var(--row-color, var(--accent));
  }
  .td-drill .body .row .nm {
    flex: 1; font-family: var(--f-body); font-size: 13px;
    color: var(--ink); font-weight: 500;
  }
  .td-drill .body .row .nm small {
    display: block; font-family: var(--f-mono); font-size: 10px;
    color: var(--muted); letter-spacing: 0.04em; margin-top: 2px;
  }
  .td-drill-backdrop {
    position: fixed; inset: 0;
    background: rgba(58,51,64,0.22);
    backdrop-filter: blur(1.5px);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
    z-index: 9099;
  }
  .td-drill-backdrop.show { opacity: 1; pointer-events: auto; }

  /* Smaller screens */
  @media (max-width: 900px) {
    .conc-grid { grid-template-columns: 1fr 1fr; }
    .entrants-wrap { grid-template-columns: 1fr; }
    .topic-mega-grid { grid-template-columns: 1fr; }
    .subtrack-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .subtrack-analysis-grid { grid-template-columns: 1fr; }
    .subtrack-bar-row { grid-template-columns: minmax(90px, 140px) 1fr 64px; }
  }
</style>
<script>
  // Dynamically set data-active on the _nav.js include so the rail highlights
  // the correct sub-track based on ?segment URL param
  (function () {
    const seg = (new URLSearchParams(location.search).get("segment") || "ebd").toLowerCase();
    const SLUG_TO_TOPIC = {
      "ebd":"topic-ebd","injectables":"topic-injectables",
      "regenerative":"topic-regenerative","regen":"topic-regenerative",
      "other":"topic-other",
      "skincare":"topic-other",
      "consumables":"topic-other","implants":"topic-other",
      "diagnostics":"topic-other","surgical":"topic-other",
      "pharma":"topic-other",
    };
    const s = document.createElement("script");
    s.src = "./_nav.js?v=20260620-subtrack-analysis";
    s.dataset.active = SLUG_TO_TOPIC[seg] || "topic-ebd";
    document.currentScript.parentNode.insertBefore(s, document.currentScript);
  })();
</script>
<script>
  (function () {
    const TRACK_COLORS = {
      "EBD":"#8E3A3A","Injectables":"#6B5A75","Skincare":"#D9AE91",
      "Regenerative":"#A8B59A","Consumables":"#5A6878","Implants":"#CFB58E",
      "Diagnostics":"#C76B68","Surgical":"#8C7B91","Pharma":"#EC9B73",
    };
    const TRACK_PILL_CLASS = {
      "EBD":"pill-ebd","Injectables":"pill-injectables","Skincare":"pill-skincare",
      "Regenerative":"pill-regen","Consumables":"pill-consumables","Implants":"pill-implants",

    function renderLifecycle (lifecycle) {
      const scatter = document.getElementById("lc-scatter");
      if (!lifecycle || !lifecycle.length) {
        scatter.innerHTML += `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:italic;color:var(--muted);">暂无生命周期数据</div>`;
        return;
      }
      const W = scatter.clientWidth || 760;
      const H = 380;
      const PAD_L = 60, PAD_R = 26, PAD_T = 36, PAD_B = 50;
      const xMin = 0, xMax = 100;
      const yMax = Math.max(2, ...lifecycle.map(l => l.companies));
      const sizeMax = Math.max(1, ...lifecycle.map(l => l.products));

      // Detect collisions: bucket lifecycle entries by (rounded x, rounded y) and
      // spread them apart along the x-axis. This is the only way two L2s with
      // momentum_pct=null (both → x=0) and same company count don't stack.
      const positionedKeys = new Map();   // key → next slot index
      const dotPositions = lifecycle.map(l => {
        const xRaw = (l.momentum_pct == null ? 0 : l.momentum_pct);
        const yRaw = l.companies;
        const key = `${Math.round(xRaw / 5)}|${yRaw}`;
        const slot = positionedKeys.get(key) || 0;
        positionedKeys.set(key, slot + 1);
        return { ...l, xRaw, yRaw, slot };
      });
      // For each colliding bucket, fan dots out by adding a horizontal offset
      // proportional to slot index. 5% per slot.
      const bucketSlotCount = new Map();
      dotPositions.forEach(d => {
        const key = `${Math.round(d.xRaw / 5)}|${d.yRaw}`;
        bucketSlotCount.set(key, positionedKeys.get(key));
      });

      // Render largest dots first so smaller ones land on top (avoids
      // interception of clicks by larger underlying dots)
      dotPositions
        .slice()
        .sort((a, b) => b.products - a.products)
        .forEach(l => {
          const key = `${Math.round(l.xRaw / 5)}|${l.yRaw}`;
          const slotCount = bucketSlotCount.get(key) || 1;
          // Fan slots from -offset to +offset around xRaw
          const offsetSpread = 6;   // % units
          const offset = slotCount > 1 ? ((l.slot - (slotCount - 1) / 2) * offsetSpread) : 0;
          const x = Math.max(xMin, Math.min(xMax, l.xRaw + offset));
          const y = l.yRaw;
          const xPx = PAD_L + ((x - xMin) / (xMax - xMin)) * (W - PAD_L - PAD_R);
          const yPx = H - PAD_B - (y / yMax) * (H - PAD_T - PAD_B);
          const r = Math.max(8, Math.min(36, Math.sqrt(l.products / sizeMax) * 32 + 6));
          const dot = document.createElement("div");
          dot.className = "lc-dot";
          dot.style.cssText = `left:${xPx}px; top:${yPx}px; width:${r}px; height:${r}px; --dot-color:${baseColor}; background:${baseColor};`;
          dot.title = `${l.l2} · ${l.products} 产品 · ${l.companies} 家 · 动能 ${l.momentum_pct == null ? "— (无 approval 数据)" : l.momentum_pct + "%"} · 最近 ${l.latest_year || "—"}`;
          dot.dataset.l2 = l.l2;
          dot.addEventListener("click", () => openL2Drill(l));
          scatter.appendChild(dot);
          if (l.products >= 5) {
            const lbl = document.createElement("div");
            lbl.className = "lc-dot-label";
            lbl.style.left = xPx + "px";
            lbl.style.top = (yPx - r/2) + "px";
            lbl.textContent = abbr(l.l2, 18);
            scatter.appendChild(lbl);
          }
        });

      // Axis labels (tick marks)
      [0, 25, 50, 75, 100].forEach(v => {
        const xPx = PAD_L + ((v - xMin) / (xMax - xMin)) * (W - PAD_L - PAD_R);
        const tick = document.createElement("div");
        tick.style.cssText = `position:absolute; left:${xPx}px; bottom:30px; transform:translateX(-50%); font-family:var(--f-mono); font-size:9.5px; color:var(--muted);`;
        tick.textContent = v + "%";
        scatter.appendChild(tick);
      });
      [0, Math.ceil(yMax / 2), yMax].forEach(v => {
        const yPx = H - PAD_B - (v / yMax) * (H - PAD_T - PAD_B);
        const tick = document.createElement("div");
        tick.style.cssText = `position:absolute; top:${yPx}px; left:14px; transform:translateY(-50%); font-family:var(--f-mono); font-size:9.5px; color:var(--muted);`;
        tick.textContent = v;
        scatter.appendChild(tick);
      });
    }

    function openL2Drill (l) {

        return brands.some(b => (co.name || "").toLowerCase().includes(b.toLowerCase()) ||

      openTopicDrill({
        stamp: `L2 lifecycle · ${L1}`,

    function renderSubtrackAnalysis(focus, l1, color) {
      if (!focus) return "";
      const cfg = getFocusConfig(focus);
      if (!cfg) return "";
      const facts = (((window.V3_PIVOT_DATA || {}).facts) || []);
      if (!facts.length) return "";
      const productRows = uniqueProductRows(facts.filter(f => cfg.match(f)));
      if (!productRows.length) return "";

      const baseL1 = cfg.baseL1 || l1;
      const baseLabel = cfg.baseLabel || ((L1_TAGLINE[baseL1] || {}).zh) || baseL1;
      const titleSuffix = /[A-Za-z0-9]$/.test(cfg.title || "") ? " 分析" : "分析";
      const universeRows = uniqueProductRows(facts.filter(f => f.l1 === baseL1));
      const denominator = universeRows.length || productRows.length || 1;
      const companies = uniqueCount(productRows, f => f.ci || f.co);
      const countries = uniqueCount(productRows, f => f.cy);
      const regulators = uniqueCount(productRows.flatMap(f => arrayify(f.reg)), v => v);
      const share = productRows.length / denominator * 100;

      const l2Rows = topCounts(productRows, f => f.l2, 8);
      const techRows = topCounts(productRows, f => f.t || f.m3 || f.m2, 8);
      const countryRows = topCounts(productRows, f => f.cy, 8);
      const regRows = topMultiCounts(productRows, "reg", 8);
      const indicationRowsRaw = topMultiCounts(productRows, "ind", 8);
      const indicationRows = indicationRowsRaw.filter(r => !/未标注|待补|unknown/i.test(r.name));
      const companyRows = topCounts(productRows, f => f.co, 8);
      const l2Total = l2Rows.reduce((sum, r) => sum + r.n, 0);
      const regTotal = regRows.reduce((sum, r) => sum + r.n, 0);
      const indTotal = (indicationRows.length ? indicationRows : indicationRowsRaw).reduce((sum, r) => sum + r.n, 0);

      return `
        <section class="block subtrack-analysis" id="subtrack-analysis" style="--topic-color:${color};">
          <div class="section-head">
            <h2>${esc(cfg.title)}${titleSuffix}</h2>
            <span class="cn">· ${esc(cfg.scopeLabel || "二级赛道")}</span><span class="en">Sub-track lens</span>
          </div>
          <p class="lede" style="margin-bottom:12px;font-size:13.5px;">先看当前二级赛道的市场结构、国家分布、技术材料、监管通道和适应症，再进入下方产品与公司清单。</p>
          <div class="subtrack-kpi-grid">
            <div class="subtrack-kpi">
              <span class="k">产品线</span>
              <span class="v">${productRows.length}</span>
              <span class="d">${esc(baseLabel)}内 ${share.toFixed(1)}%</span>
            </div>
            <div class="subtrack-kpi">
              <span class="k">公司</span>
              <span class="v">${companies}</span>
              <span class="d">品牌方 / 制造商</span>
            </div>
            <div class="subtrack-kpi">
              <span class="k">国家 / 地区</span>
              <span class="v">${countries}</span>
              <span class="d">商业覆盖</span>
            </div>
            <div class="subtrack-kpi">
              <span class="k">监管通道</span>
              <span class="v">${regulators}</span>
              <span class="d">多监管证据</span>
            </div>
          </div>
          <div class="subtrack-analysis-grid">
            ${l2Rows.length > 1 ? `
              <div class="subtrack-chart wide">
                <h3>二级构成</h3>
                <div class="subtrack-bar-list">${renderSubtrackBars(l2Rows, l2Total || productRows.length, color)}</div>
              </div>
            ` : ""}
            <div class="subtrack-chart">
              <h3>技术 / 材料构成</h3>
              <div class="subtrack-bar-list">${renderSubtrackBars(techRows, productRows.length, color)}</div>
            </div>
            <div class="subtrack-chart">
              <h3>国家分布</h3>
              <div class="subtrack-bar-list">${renderSubtrackBars(countryRows, productRows.length, color)}</div>
            </div>
            <div class="subtrack-chart">
              <h3>监管通道</h3>
              <div class="subtrack-bar-list">${renderSubtrackBars(regRows, regTotal || productRows.length, color)}</div>
            </div>
            <div class="subtrack-chart">
              <h3>适应症分布</h3>
              <div class="subtrack-bar-list">${renderSubtrackBars(indicationRows.length ? indicationRows : indicationRowsRaw, indTotal || productRows.length, color)}</div>
            </div>
            <div class="subtrack-chart wide">
              <h3>头部公司集中度</h3>
              <div class="subtrack-bar-list">${renderSubtrackBars(companyRows, productRows.length, color)}</div>
            </div>
          </div>
        </section>
      `;
    }

    function getFocusConfig(focus) {
      const cfg = {
        "ha-fillers": {
          title: "HA 填充",
          scopeLabel: "透明质酸填充剂",
          baseL1: "Injectables",
          match: f => f.l1 === "Injectables" && f.l2 === "Dermal Filler" && hasAny(f, ["hyaluronic", "透明质酸", "ha dermal", "ha filler", "交联ha"]),
        },
        "skin-boosters": {
          title: "Skin Booster / 中胚层",
          scopeLabel: "肤质改善与周期治疗",
          baseL1: "Injectables",
          match: f => f.l1 === "Injectables" && (["Skin Booster", "Mesotherapy"].includes(f.l2) || hasAny(f, ["skin booster", "mesotherapy", "水光", "中胚层"])),
        },
        "neurotoxin": {
          title: "肉毒毒素",
          scopeLabel: "毒素注射",
          baseL1: "Injectables",
          match: f => f.l1 === "Injectables" && (f.l2 === "Neurotoxin" || hasAny(f, ["botulinum", "toxin", "肉毒"])),
        },
        "biostimulators": {
          title: "生物刺激剂",
          scopeLabel: "胶原刺激与长效再生",
          baseL1: "Injectables",
          match: f => f.l1 === "Injectables" && (f.l2 === "Biostimulator" || hasAny(f, ["biostimulator", "plla", "pdlla", "pcl", "caha", "poly-l-lactic"])),
        },
        "collagen-nucleotides": {
          title: "胶原 / PN / PDRN",
          scopeLabel: "修复与再生注射材料",
          baseL1: "Injectables",
          match: f => f.l1 === "Injectables" && hasAny(f, ["collagen", "polynucleotide", "pdrn", " pn ", "胶原", "多聚核苷酸"]),
        },
        "threads": {
          title: "埋线提升",
          scopeLabel: "耗材 / 提升线",
          baseL1: "Injectables",
          match: f => hasAny(f, ["thread lift", "thread", "埋线", "提升线"]),
        },
        "laser-ipl": {
          title: "激光 / IPL",
          scopeLabel: "光源设备",
          baseL1: "EBD",
          match: f => f.l1 === "EBD" && (["Laser", "IPL", "LED/Light Therapy", "Hair Removal"].includes(f.l2) || hasAny(f, ["laser", "ipl", "picosecond", "nd:yag", "co2", "alexandrite", "光疗"])),
        },
        "rf": {
          title: "射频 / RF",
          scopeLabel: "热刺激与紧致",
          baseL1: "EBD",
          match: f => f.l1 === "EBD" && (f.l2 === "Radiofrequency" || hasAny(f, ["radiofrequency", " rf ", "fractional rf", "射频"])),
        },
        "hifu-ultrasound": {
          title: "HIFU / 超声",
          scopeLabel: "聚焦超声与提拉",
          baseL1: "EBD",
          match: f => f.l1 === "EBD" && (["HIFU", "Ultrasound"].includes(f.l2) || hasAny(f, ["hifu", "ultrasound", "lipus", "超声"])),
        },
        "microneedling": {
          title: "微针 / RF 微针",
          scopeLabel: "微针与复合导入",
          baseL1: "EBD",
          match: f => f.l1 === "EBD" && (f.l2 === "Microneedling" || hasAny(f, ["microneedling", "micro-needle", "微针"])),
        },
        "body-shaping": {
          title: "身体塑形 / EMS",
          scopeLabel: "塑形、减脂与肌肉刺激",
          baseL1: "EBD",
          match: f => f.l1 === "EBD" && (["Body Contouring", "EMS", "Cryotherapy", "Shockwave"].includes(f.l2) || hasAny(f, ["body", "ems", "hifem", "cryo", "cryolipolysis", "muscle", "lipolysis", "身体塑形"])),
        },
        "hybrid-energy": {
          title: "联合能源 / 其他",
          scopeLabel: "多能量平台与边缘设备",
          baseL1: "EBD",
          match: f => f.l1 === "EBD" && (["Other EBD", "Platform", "Plasma", "Injection Devices", "Skin Management", "Professional Treatment"].includes(f.l2) || hasAny(f, ["multi-platform", "hybrid", "plasma", "electroporation", "carboxytherapy"])),
        },
        "exosome": {
          title: "外泌体",
          scopeLabel: "再生外泌体",
          baseL1: "Regenerative",
          match: f => f.l1 === "Regenerative" && (f.l2 === "Exosome" || hasAny(f, ["exosome", "外泌体"])),
        },
        "prp-prf": {
          title: "PRP / PRF",
          scopeLabel: "自体血液来源",
          baseL1: "Regenerative",
          match: f => f.l1 === "Regenerative" && (f.l2 === "PRP-PRF" || hasAny(f, ["prp", "prf", "platelet", "血小板"])),
        },
        "stem-cell": {
          title: "干细胞",
          scopeLabel: "细胞治疗",
          baseL1: "Regenerative",
          match: f => f.l1 === "Regenerative" && (f.l2 === "Cell Therapy" || hasAny(f, ["stem cell", "干细胞", "cell therapy"])),
        },
        "growth-factor": {
          title: "生长因子",
          scopeLabel: "因子与生物活性物",
          baseL1: "Regenerative",
          match: f => f.l1 === "Regenerative" && (["Growth Factor", "Biologics"].includes(f.l2) || hasAny(f, ["growth factor", "peptide", "生长因子"])),
        },
      };
      return cfg[focus] || null;
    }

    function renderSubtrackBars(rows, total, color) {
      if (!rows || !rows.length) {
        return `<div class="subtrack-empty">暂无可聚合记录</div>`;
      }
      const max = Math.max(1, ...rows.map(r => r.n));
      return rows.map(r => {
        const pctOfMax = r.n / max * 100;
        const share = total ? r.n / total * 100 : 0;
        return `
          <div class="subtrack-bar-row" title="${esc(r.name)} · ${r.n} · ${share.toFixed(1)}%">
            <span class="name">${esc(abbr(r.name, 30))}</span>
            <span class="track"><span class="fill" style="--topic-color:${color}; --pct:${pctOfMax.toFixed(1)}%;"></span></span>
            <span class="n">${r.n} · ${share.toFixed(1)}%</span>
          </div>
        `;
      }).join("");
    }

    function uniqueProductRows(rows) {
      const seen = new Set();
      return (rows || []).filter(row => {
        const id = row.p || `${row.co || ""}|${row.nm || ""}|${row.l1 || ""}|${row.l2 || ""}`;
        if (seen.has(id)) return false;
        seen.add(id);
        return true;
      });
    }

    function topCounts(rows, getter, limit) {
      const counts = new Map();
      (rows || []).forEach(row => {
        const raw = getter(row);
        const key = String(raw || "未标注").trim() || "未标注";
        counts.set(key, (counts.get(key) || 0) + 1);
      });
      return Array.from(counts, ([name, n]) => ({ name, n }))
        .sort((a, b) => b.n - a.n || a.name.localeCompare(b.name))
        .slice(0, limit || 8);
    }

    function topMultiCounts(rows, key, limit) {
      const counts = new Map();
      (rows || []).forEach(row => {
        const values = arrayify(row[key]);
        (values.length ? values : ["未标注"]).forEach(value => {
          const name = String(value || "未标注").trim() || "未标注";
          counts.set(name, (counts.get(name) || 0) + 1);
        });
      });
      return Array.from(counts, ([name, n]) => ({ name, n }))
        .sort((a, b) => b.n - a.n || a.name.localeCompare(b.name))
        .slice(0, limit || 8);
    }

    function uniqueCount(rows, getter) {
      const s = new Set();
      (rows || []).forEach(row => {
        const value = getter(row);
        if (value !== null && value !== undefined && value !== "") s.add(String(value));
      });
      return s.size;
    }

    function arrayify(value) {
      if (Array.isArray(value)) return value.filter(v => v !== null && v !== undefined && v !== "");
      if (value === null || value === undefined || value === "") return [];
      return [value];
    }

    function hasAny(fact, keys) {
      const hay = factText(fact);
      return (keys || []).some(key => hay.includes(String(key).toLowerCase()));
    }

    function factText(fact) {
      return [
        fact.l1, fact.l2, fact.m1, fact.m2, fact.m3, fact.t,
        fact.b, fact.nm, fact.co, fact.cy, fact.rg,
      ].filter(Boolean).join(" ").toLowerCase();
    }

    function slugify(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/_/g, "-")
        .replace(/[^a-z0-9-]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function renderOtherProductsOverview(tracks, appData) {
      const rows = OTHER_TOPIC_LINKS.map(item => {
        const breakdown = (tracks.l1_breakdown || []).find(row => row.l1 === item.l1) || {};
        return {
          ...item,
          products: Number(breakdown.products || 0),
          companies: Number(breakdown.companies || 0),
          topTech: ((breakdown.tech_top || [])[0] || [])[0] || "—",
          note: (L1_TAGLINE[item.l1] || {}).note || "",
        };
      });
      const totalProducts = rows.reduce((sum, row) => sum + row.products, 0);
      const totalCompanies = rows.reduce((sum, row) => sum + row.companies, 0);
      root.innerHTML = `
        <section class="page-hero">
          <div class="eyebrow-chip"><span class="dot"></span>Topic Detail · Other Lines</div>
          <h1>
            其他产品线
            <span class="h1-en">Other Product Lines</span>
          </h1>
          <p class="lede">这里聚合不需要单独占据顶部一级入口的产品线，包括皮肤管理 / 功效护肤、植入物、耗材、诊断、外科和药物。每条子线仍保留独立详情页。</p>
          <div class="stat-row">
            <span><span class="num" data-count-up="${totalProducts}">${totalProducts}</span> 款产品 · <span class="num" data-count-up="${totalCompanies}">${totalCompanies}</span> 家公司</span>
            <span>${rows.length} 条子产品线</span>
            <span>从顶部 hover 树状菜单下钻</span>
          </div>
          <div class="filter-row" style="margin-top:22px;">
            ${PRIMARY_TOPIC_LINKS.map(item => {
              const active = item.slug === "other" ? " active" : "";
              const color = topicLinkColor(item);
              return `<a class="filter-pill${active}" href="?segment=${item.slug}" style="${active ? `background:${color}; border-color:${color};` : ""}">${esc(item.label)}</a>`;
            }).join("")}
          </div>
        </section>

        <section class="block">
          <div class="section-head">
            <h2>其他产品线结构</h2>
            <span class="cn">· 聚合入口</span><span class="en">Other line map</span>
          </div>
          <div class="topic-mega-grid">
            ${rows.map(row => `
              <a class="topic-mega-card" href="?segment=${row.slug}" style="--topic-color:${TRACK_COLORS[row.l1] || TRACK_COLORS.Consumables};">
                <span>
                  <strong>${esc(row.label)}</strong>
                  <span>${esc(row.en)} · ${esc(row.topTech)} · ${row.companies} companies</span>
                </span>
                <em>${row.products || "—"}</em>
              </a>
            `).join("")}
          </div>
        </section>

        <section class="block">
          <div class="section-head">
            <h2>使用方式</h2>
            <span class="cn">· 不把低频线铺满顶部</span><span class="en">Navigation logic</span>
          </div>
          <div class="chart-card">
            <div class="chart-title">顶部只放策略级入口，低频产品线放在树状菜单下钻</div>
            <div class="chart-sub">皮肤管理、植入物、耗材、诊断、外科和药物仍然保留独立数据页，但不再和注射剂、EBD 这类超级赛道争夺一级导航空间。</div>
          </div>
        </section>
      `;
    }

    function renderMegaTrackTabs(l1, segments, color, techRows) {
      const groups = {
        "Injectables": [
          { focus: "ha-fillers", label: "HA 填充", en: "HA fillers", keys: ["dermal filler", "hyaluronic", "ha "], note: "容量、轮廓和基础填充主干" },
          { focus: "skin-boosters", label: "Skin Booster / 中胚层", en: "skin boosters", keys: ["skin booster", "mesotherapy"], note: "肤质改善和周期治疗" },
          { focus: "neurotoxin", label: "肉毒毒素", en: "botulinum toxins", keys: ["neurotoxin", "botulinum", "toxin"], note: "动态纹、肌肉和复合适应症" },
          { focus: "biostimulators", label: "生物刺激剂", en: "biostimulators", keys: ["biostimulator", "plla", "pcl", "caha"], note: "胶原刺激和长效再生" },
          { focus: "collagen-nucleotides", label: "胶原 / PN / PDRN", en: "collagen and nucleotides", keys: ["collagen", "pdrn", "pn", "polynucleotide"], note: "修复、再生和肤质替代路线" },
        ],
        "EBD": [
          { focus: "laser-ipl", label: "激光 / IPL", en: "laser and light", keys: ["laser", "ipl", "picosecond", "co2"], note: "色素、嫩肤、脱毛和换肤" },
          { focus: "rf", label: "射频 / RF", en: "radiofrequency", keys: ["radiofrequency", "rf"], note: "紧致、微针和热刺激" },
          { focus: "hifu-ultrasound", label: "HIFU / 超声", en: "hifu and ultrasound", keys: ["hifu", "ultrasound", "lipus"], note: "深层提拉和组织加热" },
          { focus: "microneedling", label: "微针 / RF 微针", en: "microneedling", keys: ["microneedling"], note: "瘢痕、毛孔和复合导入" },
          { focus: "body-shaping", label: "身体塑形 / EMS", en: "body shaping", keys: ["ems", "body", "muscle", "cryo"], note: "塑形、减脂和肌肉刺激" },
          { focus: "hybrid-energy", label: "联合能源 / 其他", en: "hybrid energy", keys: ["plasma", "led", "electroporation", "multi"], note: "多能量组合和设备平台化" },
        ],
      }[l1];
      if (!groups) return "";
      const rows = groups.map(group => {
        const n = countMegaGroup(segments, group.keys) || countMegaGroupTech(techRows, group.keys);
        return `
          <a class="topic-mega-card" href="?segment=${segment}&focus=${group.focus}#subtrack-analysis" style="--topic-color:${color};">
            <span>
              <strong>${esc(group.label)}</strong>
              <span>${esc(group.en)} · ${esc(group.note)}</span>
            </span>
            <em>${n || "—"}</em>
          </a>
        `;
      }).join("");
      return `
        <section class="block">
          <div class="section-head">
            <h2>${l1 === "Injectables" ? "注射剂二级结构" : "EBD 二级结构"}</h2>
            <span class="cn">· 超级赛道入口</span><span class="en">Second-level track map</span>
          </div>
          <div class="topic-mega-grid">${rows}</div>
        </section>
      `;
    }

    function countMegaGroup(segments, keys) {
      return (segments || []).reduce((sum, segment) => {
        const hay = [segment.l2, segment.name, segment.label, segment.tech, segment.path]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();
        if (!keys.some(key => hay.includes(String(key).toLowerCase()))) return sum;
        return sum + Number(segment.products || segment.n_products || segment.n || segment.count || 0);
      }, 0);
    }

    function countMegaGroupTech(rows, keys) {
      return (rows || []).reduce((sum, row) => {
        const name = String((Array.isArray(row) ? row[0] : row.tech) || "").toLowerCase();
        if (!keys.some(key => name.includes(String(key).toLowerCase()))) return sum;
        return sum + Number((Array.isArray(row) ? row[1] : row.n) || 0);
      }, 0);
    }

    function topicLinkColor(item) {
      return item.slug === "other" ? TRACK_COLORS.Consumables : (TRACK_COLORS[item.l1] || TRACK_COLORS.Consumables);
    }

    // helpers
    function esc (s) {
      return String(s || "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[ch]);
    }
    function abbr (s, len) {
      const t = String(s || "");
      return t.length > (len || 20) ? t.slice(0, (len || 20) - 1) + "…" : t;
    }
  })();
</script>
