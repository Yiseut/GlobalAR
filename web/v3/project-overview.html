<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>项目总览 · 全球医美情报 · v3</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="./styles.css?v=20260620-project-overview" />
<style>
  .project-hero {
    margin-bottom: 24px;
  }
  .project-hero .page-hero {
    margin: 0;
  }
  .project-hero .page-hero-slim {
    display: block;
    border-bottom: 0;
    padding-bottom: 0;
  }
  .project-hero .page-hero .lede {
    max-width: 62ch;
  }
  .overview-panel h2 {
    margin: 0;
    font-family: var(--f-display-cn);
    font-size: 22px;
    font-weight: 300;
    color: var(--ink);
  }
  .overview-panel p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }
  .overview-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }
  .overview-panel {
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 18px;
    background: rgba(253,250,242,0.72);
    box-shadow: var(--shadow-card);
    min-width: 0;
  }
  .pillar-grid {
    display: grid;
    gap: 10px;
    margin-top: 14px;
  }
  .pillar-card,
  .progress-row {
    border: 1px solid var(--hairline-2);
    border-radius: 8px;
    padding: 12px;
    background: rgba(255,252,245,0.70);
    min-width: 0;
  }
  .pillar-card strong,
  .progress-row strong {
    display: block;
    color: var(--ink);
    font-size: 14px;
    line-height: 1.35;
  }
  .pillar-card span,
  .progress-row span {
    display: block;
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }
  .progress-list {
    display: grid;
    gap: 10px;
    margin-top: 14px;
  }
  .progress-row {
    display: grid;
    grid-template-columns: 92px minmax(0, 1fr);
    gap: 12px;
  }
  .phase {
    color: var(--accent-2);
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  @media (max-width: 980px) {
    .project-hero,
    .overview-grid {
      grid-template-columns: 1fr;
    }
    .progress-row {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<header id="topbar"></header>

<div class="shell">
  <aside id="rail" aria-label="情报视角导航"></aside>
  <main class="content">
    <section class="project-hero">
      <div class="page-hero page-hero-slim">
        <h1>
          全球医美情报项目总览
          <span class="h1-en">Aestrat Global Aesthetics Intelligence</span>
        </h1>
      </div>
    </section>

    <section class="block">
      <div class="section-head">
        <h2>最近进展</h2>
        <span class="cn">· 2026-06-20</span><span class="en">Latest state</span>
      </div>
      <div class="overview-grid">
        <article class="overview-panel">
          <h2>已完成</h2>
          <div class="pillar-grid" id="overviewRecent"></div>
        </article>
        <article class="overview-panel">
          <h2>本轮落地</h2>
          <div class="pillar-grid" id="overviewCompletion"></div>
        </article>
      </div>
    </section>
  </main>
</div>

<script src="../app-data.js?v=20260620"></script>
<script src="./v3-market-intelligence.js?v=20260620"></script>
<script src="./_nav.js" data-active="project-overview"></script>
<script>
  (function () {
    const market = window.V3_MARKET_INTELLIGENCE_DATA || {};
    const completion = Array.isArray(market.nextStepCompletion) ? market.nextStepCompletion : [];
    const esc = value => String(value == null ? "" : value).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" }[ch]));
    document.getElementById("overviewRecent").innerHTML = [
      ["ISAPS 主干", "2020-2024 已接入国家-年份-赛道时间轴，治疗数量和医生数量分开建模。"],
      ["ASPS 深挖", "美国 ASPS 已扩成 2020、2022、2023、2024 时间轴，并接入 2024 费用和区域拆分。"],
      ["Top 15 国家覆盖", "企业数量前 15 的国家/地区已拆成治疗量、QA、渠道密度和需求 context。"],
      ["商业格局页", "已新增渠道密度、欧洲 QA 和上市公司收入层覆盖。"],
    ].map(([title, note]) => `<div class="pillar-card"><strong>${esc(title)}</strong><span>${esc(note)}</span></div>`).join("");
    document.getElementById("overviewCompletion").innerHTML = completion.map(row => `
      <div class="pillar-card">
        <strong>${esc(row.frontstageLabel || row.workstream)}</strong>
        <span>${esc(row.note || row.status)} · ${esc(row.rows || 0)} rows</span>
      </div>
    `).join("") || `<div class="pillar-card"><strong>数据层已更新</strong><span>已生成 ASPS、欧洲 QA、渠道密度和公司收入层 CSV。</span></div>`;
  })();
</script>
</body>
</html>
